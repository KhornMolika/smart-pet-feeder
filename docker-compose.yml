services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-feeder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: feeder
      POSTGRES_PASSWORD: feeder_secret
      POSTGRES_DB: smart_pet_feeder
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeder -d smart_pet_feeder"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: pet-feeder-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
