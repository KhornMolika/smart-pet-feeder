name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Build Docker Images & Push to Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: CHINCHEM
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 2: SSH Deploy to AWS EC2 Instance (Pull Pre-built Images Only)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: CHINCHEM
    steps:
      - name: Checkout Compose & Config Files
        uses: actions/checkout@v4

      - name: Copy Compose and Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.traefik.yml,mosquitto/config/mosquitto.conf"
          target: "/home/ubuntu"

      - name: Pull Images and Update Containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            cd /home/ubuntu
            echo "📂 [Deploy] Working in directory: $(pwd)"

            # Check if .env is present
            if [ ! -f .env ]; then
              echo "⚠️ [Deploy] Warning: .env file not found in $(pwd)! Ensure your environment variables are set."
            fi

            # Pull newly pushed pre-built images from Docker Hub
            echo "🐳 [Deploy] Pulling pre-built images from Docker Hub..."
            docker compose -f docker-compose.traefik.yml pull backend frontend traefik

            # Re-create updated containers with zero downtime
            echo "🔄 [Deploy] Updating services..."
            docker compose -f docker-compose.traefik.yml up -d --remove-orphans

            # Clean up old unused images to save disk space
            echo "🧹 [Deploy] Cleaning up old dangling images..."
            docker image prune -f

            echo "✅ [Deploy] Deployment completed successfully!"
