name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Build Docker Images & Push to Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    environment: CHINCHEM
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chinchem-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 2: SSH Deploy to AWS EC2 Instance (Native OpenSSH SCP & SSH)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: CHINCHEM
    steps:
      - name: Checkout Compose File
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy docker-compose.traefik.yml to Server
        run: |
          scp -o StrictHostKeyChecking=no -P ${{ secrets.SERVER_PORT || 22 }} \
            docker-compose.traefik.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/docker-compose.traefik.yml

      - name: Execute Deployment Commands via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT || 22 }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'bash -se' << 'EOF'
          cd /home/ubuntu
          echo "📂 [Deploy] Current Directory: $(pwd)"

          # Ensure mosquitto config exists without overwriting locked permissions
          if [ ! -f mosquitto/config/mosquitto.conf ]; then
            mkdir -p mosquitto/config
            printf 'listener 1883\nallow_anonymous true\n' > mosquitto/config/mosquitto.conf
          fi

          # Check if .env is present
          if [ ! -f .env ]; then
            echo "⚠️ [Deploy] Warning: .env file not found in $(pwd)! Ensure your environment variables are configured."
          fi

          # Free up disk space before pulling to prevent 'no space left on device'
          echo "🧹 [Deploy] Freeing Docker build cache and unused images..."
          docker system prune -af --volumes=false || true
          docker builder prune -af || true

          # Pull newly pushed pre-built images from Docker Hub
          echo "🐳 [Deploy] Pulling pre-built images from Docker Hub..."
          docker compose -f docker-compose.traefik.yml pull backend frontend traefik

          # Re-create updated containers with zero downtime
          echo "🔄 [Deploy] Updating services..."
          docker compose -f docker-compose.traefik.yml up -d --remove-orphans

          # Clean up old unused images to save disk space
          echo "🧹 [Deploy] Cleaning up old dangling images..."
          docker image prune -f

          echo "✅ [Deploy] Deployment completed successfully!"
          EOF
